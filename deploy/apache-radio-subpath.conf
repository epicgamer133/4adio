# Apache: the radio in a subfolder of an existing site, e.g. https://yourdomain.com/radio
# Needs BASE_PATH=/radio in the radio's .env (the app serves everything under /radio).
# Needs: sudo a2enmod proxy proxy_http headers
#
# Paste the block below INSIDE your site's existing HTTPS virtual host
# (the <VirtualHost *:443> one, often /etc/apache2/sites-available/yourdomain-le-ssl.conf),
# then: sudo apachectl configtest && sudo systemctl reload apache2
# Don't create a real "radio" folder in the site's web root; this proxy takes over /radio.

    # ---- 4ADIO radio at /radio ----------------------------------------------
    ProxyRequests Off

    # Live stream + now-playing events: flush immediately, keep open for a day.
    # (These must come before the general /radio line.)
    ProxyPass        /radio/stream http://127.0.0.1:8090/radio/stream flushpackets=on timeout=86400 keepalive=On
    ProxyPassReverse /radio/stream http://127.0.0.1:8090/radio/stream
    ProxyPass        /radio/events http://127.0.0.1:8090/radio/events flushpackets=on timeout=86400 keepalive=On
    ProxyPassReverse /radio/events http://127.0.0.1:8090/radio/events

    ProxyPass        /radio http://127.0.0.1:8090/radio timeout=900
    ProxyPassReverse /radio http://127.0.0.1:8090/radio

    <Location /radio>
        ProxyPreserveHost On
        RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}
        # Uploads (300 MB)
        LimitRequestBody 314572800
    </Location>

    # Never let mod_deflate buffer the audio or the event stream.
    SetEnvIf Request_URI "^/radio/(stream|events)$" no-gzip=1
    # ---- end radio -----------------------------------------------------------
