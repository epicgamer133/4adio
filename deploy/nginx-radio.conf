# nginx site for the radio on its own subdomain.
# Save as /etc/nginx/sites-available/radio.conf, symlink into sites-enabled,
# then: sudo nginx -t && sudo systemctl reload nginx
# This is a NEW server block; it does not touch your existing sites.
#
# Get HTTPS with: sudo certbot --nginx -d radio.example.com

server {
    listen 80;
    server_name radio.example.com;   # <-- change to your subdomain

    # Song uploads through the admin panel.
    client_max_body_size 300m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15m;   # long uploads + conversion
    }

    # The live audio stream: never buffer or cache, keep open indefinitely.
    location = /stream {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        gzip off;
    }

    # Live now-playing updates (Server-Sent Events).
    location = /events {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        gzip off;
    }
}
