# Apache virtual host for the radio on its own subdomain.
# Needs: sudo a2enmod proxy proxy_http headers
# Save as /etc/apache2/sites-available/radio.conf, then:
#   sudo a2ensite radio && sudo apachectl configtest && sudo systemctl reload apache2
# This is a NEW virtual host; it does not touch your existing sites.
#
# Get HTTPS with: sudo certbot --apache -d radio.example.com

<VirtualHost *:80>
    ServerName radio.example.com
    # ^ change to your subdomain

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    # Uploads (300 MB)
    LimitRequestBody 314572800

    # Live stream + now-playing events: flush immediately, keep open for a day.
    ProxyPass        /stream http://127.0.0.1:8090/stream flushpackets=on timeout=86400 keepalive=On
    ProxyPassReverse /stream http://127.0.0.1:8090/stream
    ProxyPass        /events http://127.0.0.1:8090/events flushpackets=on timeout=86400 keepalive=On
    ProxyPassReverse /events http://127.0.0.1:8090/events

    ProxyPass        / http://127.0.0.1:8090/ timeout=900
    ProxyPassReverse / http://127.0.0.1:8090/

    # Never let mod_deflate buffer the audio or the event stream.
    SetEnvIf Request_URI "^/(stream|events)$" no-gzip=1
</VirtualHost>
